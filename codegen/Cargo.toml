[package]
name = "comline-codegen-rust"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
# Consumed by git rev (see ComlineProject/docs → Design → Runtime & generation
# repository structure — no crates.io publishing at this stage). Pinned to the
# same generation rev `comline-typescript` uses, so a CLI build has one
# `comline-codegen`. Local iteration: add a `[patch]` onto a sibling checkout.
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "7baf2fb7c67d448093d7dd34b0a41d0c1de2c864" }
comline-core = { git = "https://github.com/ComlineProject/core", rev = "021fdfcc3e0de8ac2864a838a630048e21038aa3" }

eyre = "0.6.8"

# Gated (G2c — FFI / dylib): abi_stable, cbindgen, toml_edit, glob, heck.
