[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "5420f99d6c8df866d30767d38c75c2d9b61b5f03" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "a3f1b424e73414c068cdb18d1df28c77fb45fc7b" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
