[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "5883612ae051b87fcfa3b021f4e95e04e4407556" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "2eb3c5c42c11725aedbefc120b22241fd8f4ab5d" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
