[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "35ab4b801c9b35af591fb48972407468c8e8af24" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "39ba7bc1f1c85b83b14a08ebc01d52f702d1cc65" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
