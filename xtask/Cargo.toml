[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "098301516576d200aa11f3fc12aaeac695b4a43d" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "bfb31c26318afb947bdd8b5a534835cbef551fa7" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
