[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "99cde52af3898ccd211d4bfcfafce5f1e111d023" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "d7f90ec45736793683071d3a823fa8bb6c022712" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
