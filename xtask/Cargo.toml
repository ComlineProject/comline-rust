[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "016e38603152444f9b51fddfd46b1e6b1d73f1d8" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "e627ed36ea0ca4f8942cf29f59b741030ba74e2b" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
