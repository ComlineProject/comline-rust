[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "360da0e5c400f538b925f6b7540360658dc3e63c" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "3832a7d527b37c2d3006ceb77922fe4b63ed8ed3" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
