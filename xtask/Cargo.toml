[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "868e8310e33df317e3cba4f76b81fbcd8639c1c2" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "65ea53ab0c02e2779b0c18237348b96224d530be" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
