[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "7a73f629b4867e26cedb7d28adb250c15de2414f" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "b7b73175ab20fb275d65ab464df35a578d14ebb6" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
