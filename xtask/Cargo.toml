[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "f6e289aaa137258e9e96c378c32d057c249a5b5d" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "043286d544b9db4570a3c9ef13ff9f715cbfc577" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
