[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "4b77d967c68931f23592f42a6b693ab05b6c38ff" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "bccab5cff05f80fde689c607e2a969a2fe7e6012" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
