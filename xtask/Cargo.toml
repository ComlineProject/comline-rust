[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "cfddba1e01923cd556679a89d9570aa26339bec0" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "7ac76d6786be07a8641dd395efd18f9db7af9fb1" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
