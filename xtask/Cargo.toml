[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "9a6482ee21267adcdaedd4c05f114c30cfba408b" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "a5427f286e3a8febe60bf949bd24ffd0144ff12c" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
