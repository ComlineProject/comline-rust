[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same rev `codegen` pins, so this tool and the generator it drives agree on
# one `comline-core` - see codegen/Cargo.toml's own comment.
comline-core = { git = "https://github.com/ComlineProject/core", rev = "ae891afd83f9a2766f8b5cfbd59770a0104107a1" }
comline-codegen = { git = "https://github.com/ComlineProject/generation", rev = "b18881d1a61789e0b64a88be9d36f5f85fd4cc7d" }
comline-codegen-rust = { path = "../codegen" }

eyre = "0.6.8"
