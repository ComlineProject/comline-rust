name: Cargo Build & Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --verbose
      - run: cargo test --verbose
      - name: std-extra/ matches a fresh regen
        run: cargo run -p xtask -- --check

  wasip1:
    # The generator as a WASI module, which the CLI runs under wasmtime.
    # `comline-codegen` takes comline-core with `default-features = false`
    # (the IR only), so the parser and its tree-sitter dependency stay out of
    # this build (core#144).
    name: Generator builds for wasm32-wasip1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup target add wasm32-wasip1
      - run: cargo build --verbose -p comline-codegen-rust --bin comline-gen-rust --target wasm32-wasip1

  floor:
    # Generated crates must build on the oldest toolchain the generator
    # registers at (`LANG_VERSION`). The tests run on stable; the crates they
    # generate are built with the floor toolchain.
    name: Generated code builds at the floor (Rust 1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo test --verbose -p comline-codegen-rust --test compiles
        env:
          COMLINE_RUST_TOOLCHAIN: 1.85.0

  std_pin:
    # `STD_REV` can only point at a merge commit once that commit exists, so
    # this runs after the merge rather than on the PR that regenerates
    # `std-extra/`. Needs full history: the check diffs HEAD against STD_REV.
    name: comline_std pin is current
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup update stable && rustup default stable
      - run: cargo run -p xtask -- --check-pin
